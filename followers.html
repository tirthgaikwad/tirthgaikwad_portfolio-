<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPartner | My Followers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }
        
        .bg-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5; z-index: -1; animation: pulse 12s infinite alternate; }
        .glow-1 { width: 600px; height: 600px; background: linear-gradient(135deg, #dbeafe, #93c5fd); top: -200px; left: -100px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 5%; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.6); position: sticky; top: 0; z-index: 100; }
        header h2 { font-weight: 800; color: #1e40af; font-size: 1.5rem; }
        nav { display: flex; gap: 35px; }
        nav a { color: #64748b; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        nav a:hover, nav a.active { color: #2563eb; }

        main { padding: 60px 20px; width: 100%; max-width: 900px; margin: 0 auto; }
        .page-header { margin-bottom: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .results-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .dev-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; transition: transform 0.2s; }
        .dev-card:hover { transform: translateY(-5px); border-color: #bfdbfe; box-shadow: 0 15px 35px rgba(37,99,235,0.1); }
        .dev-name { color: #0f172a; font-weight: 800; font-size: 1.25rem; margin-bottom: 5px; }
        .dev-college { color: #64748b; font-size: 0.9rem; margin-bottom: 15px; }
        .btn-view { display: inline-block; background: #f8fafc; color: #0f172a; text-align: center; text-decoration: none; padding: 10px; border-radius: 10px; font-weight: 600; border: 1px solid #e2e8f0; margin-top: auto; }
        .btn-view:hover { background: #0f172a; color: white; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px; background: rgba(255,255,255,0.6); border: 2px dashed #cbd5e1; border-radius: 20px; }
        .empty-state h4 { font-size: 1.4rem; color: #1e293b; margin-bottom: 10px; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="shared.js"></script>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <header>
<div class="h-16 max-w-[1536px] mx-auto px-4 lg:px-6 flex items-center justify-between gap-4">
    <!-- Left: Logo + Navigation -->
    <div class="flex items-center gap-4 xl:gap-8">
      <div class="flex items-center gap-2 shrink-0 cursor-pointer" onclick="window.location.href='index.html'">
        <img alt="ProPartner" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLYIVUTWgawVVcDf_AfO3osE5aQelSrQ-BiqZCvpbzadGqYt7RtjKuzKYtNzfOW-oW-6uJ8eSUDVEMDSBc_fUiLQjgWl837nw2mEMwiXz5c0mKkUYfQE2dbsmzbhRVZOjIy3Ds3vVzS319wCOCj9COqFm303zTmlcG9IfKWC6GtY75OxB_hkdbyS0D1vDdI1OkWuXELojjbtqR_tKJu-Q9_B0SX5XmdV9oiZSqvej275TiiIHhxGQD"/>
        <span class="text-xl font-bold tracking-tight text-slate-900">ProPartner</span>
      </div>
      <nav class="hidden xl:flex items-center gap-0.5 h-16">
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="search.html">Discover Talent</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="board.html">Opportunities Board</a>
        <a aria-current="page" class="h-full flex items-center px-2 text-[13px] font-semibold text-primary border-b-2 border-primary whitespace-nowrap" href="team.html">My Teams</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="project_management.html">Project Hub</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="college.html">Campus Network</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="research.html">Research Collab</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="network.html">My Network</a>
        <a class="h-full flex items-center px-2 text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors whitespace-nowrap" href="saved.html">Saved Profiles</a>
      </nav>
    </div>

    <!-- Right: Search + Utilities + Profile -->
    <div class="flex items-center gap-1.5 shrink-0">
      <!-- Search Bar -->
      <div class="hidden md:flex items-center gap-1.5 bg-slate-50 hover:bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 cursor-pointer transition-colors w-44" onclick="document.getElementById('search-modal') && document.getElementById('search-modal').classList.add('active')">
        <span class="material-symbols-outlined text-slate-400 text-[16px]">search</span>
        <span class="text-[12px] text-slate-400 truncate">Search network...</span>
        <kbd class="ml-auto text-[10px] font-semibold text-slate-400 bg-white px-1 py-0.5 rounded border border-slate-200 shadow-sm">⌘K</kbd>
      </div>

      <!-- Divider -->
      <div class="h-5 w-px bg-slate-200 hidden md:block mx-0.5"></div>

      <!-- Admin Link -->
      <a class="hidden lg:flex items-center gap-1 text-slate-500 hover:text-primary transition-colors text-[13px] font-semibold px-2 py-1.5 rounded-lg hover:bg-slate-50 whitespace-nowrap" href="admin_dashboard.html">
        <span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
        Admin
      </a>

      <!-- Notifications -->
      <button aria-label="Notifications" class="relative p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors" type="button" data-notif-btn>
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span data-notif-badge class="absolute top-1.5 right-1.5 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white" style="display:none;"></span>
      </button>

      <!-- Direct Messages -->
      <button aria-label="Direct Messages" class="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors" type="button" onclick="window.location.href='inbox.html'">
        <span class="material-symbols-outlined text-[20px]">chat_bubble</span>
      </button>

      <!-- Menu Dropdown -->
      <div class="relative group inline-block">
        <button aria-label="More Options" class="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors" type="button">
          <span class="material-symbols-outlined text-[20px]">menu</span>
        </button>
        <div class="absolute right-0 top-full mt-1 w-48 bg-white rounded-xl shadow-lg border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden">
          <a href="history.html" class="flex items-center gap-2 px-4 py-3 text-slate-700 hover:bg-slate-50 transition-colors text-[13px] font-medium">
            <span class="material-symbols-outlined text-[18px]">history</span>
            Activity History
          </a>
          <button onclick="window.logout()" class="w-full flex items-center gap-2 px-4 py-3 text-rose-600 hover:bg-rose-50 transition-colors text-[13px] font-medium">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            Log Out
          </button>
        </div>
      </div>

      <!-- Profile Avatar -->
      <div class="relative cursor-pointer pl-0.5" onclick="window.location.href='profile.html'">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center overflow-hidden" data-header-avatar>
          <span class="material-symbols-outlined text-white text-[18px]">person</span>
        </div>
        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white" title="Active Now"></span>
      </div>
    </div>
  </div>
</header>

    <main>
        <div class="page-header">
            <h1>My Network</h1>
            <p>Developers who are following your profile.</p>
        </div>
        <div id="followersContainer" class="results-container"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('currentUserId');
            const container = document.getElementById('followersContainer');

            if (!userId) {
                container.innerHTML = `<div class="empty-state"><h4>Please Log In</h4><p>You need to be logged in to view your followers.</p></div>`;
                return;
            }

            try {
                const res = await fetch(`http://127.0.0.1:8000/api/followers/${userId}`);
                const followers = await res.json();

                if (followers.length === 0) {
                    container.innerHTML = `<div class="empty-state"><h4>No Followers Yet</h4><p>When someone follows your profile, they will appear here.</p></div>`;
                    return;
                }

                followers.forEach(dev => {
                    container.innerHTML += `
                        <div class="dev-card">
                            <div class="dev-name">${dev.name}</div>
                            <div class="dev-college">🎓 ${dev.college_name}</div>
                            <div style="margin-bottom: 20px; color:#2563eb; font-size: 0.9rem;">${dev.skills}</div>
                            <div style="display: flex; gap: 8px;">
                                <a href="profile.html?id=${dev.id}" class="btn-view" style="flex: 1; text-align: center;">View Profile</a>
                                <a href="inbox.html?user=${dev.id}" title="Quick Chat" style="display: flex; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 8px; background: var(--surface-container); color: var(--on-surface-variant); text-decoration: none;">
                                    <span class="material-symbols-outlined" style="font-size: 20px;">chat</span>
                                </a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><h4>Network Error</h4><p>Could not load followers.</p></div>`;
            }
        });
    </script>
<script src="shared.js"></script>
</body>
</html>
