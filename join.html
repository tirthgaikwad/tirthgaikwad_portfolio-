<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect2Minds | Join</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <style>
        :root { 
            --bg: #FEF9FF; 
            --surface: rgba(255, 255, 255, 0.7); 
            --border: rgba(115, 108, 237, 0.2); 
            --primary: #736CED; 
            --secondary: #9F9FED; 
            --accent: #D4C1EC; 
            --text: #1e1e2f; 
            --text-dim: #64748b; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden;}
        
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.6; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(254, 249, 255, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); box-shadow: 0 4px 30px rgba(115, 108, 237, 0.05); z-index: 100;}
        header h2 { font-weight: 800; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
        nav { display: flex; gap: 40px; }
        nav a { color: var(--text-dim); text-decoration: none; font-weight: 600; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }

        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 100px 20px 60px; }
        
        .join-card { background: var(--surface); padding: 50px; border-radius: 30px; box-shadow: 0 20px 50px rgba(115, 108, 237, 0.1); width: 100%; max-width: 700px; border: 1px solid var(--border); backdrop-filter: blur(24px); }
        .join-header { text-align: center; margin-bottom: 40px; }
        .join-header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; color: var(--text); letter-spacing: -1px; }
        .join-header p { color: var(--text-dim); font-size: 1.1rem; }

        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; text-align: left; }
        .form-group.full { width: 100%; margin-bottom: 20px; }
        
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px 20px; border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,0.8); color: var(--text); font-size: 1rem; transition: 0.3s; font-family: inherit;}
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(115, 108, 237, 0.15); background: #fff; }

        .choices__inner { background-color: rgba(255,255,255,0.8) !important; border: 1px solid var(--border) !important; border-radius: 16px !important; padding: 10px 20px !important; font-size: 1rem !important; color: var(--text) !important; min-height: 52px !important; transition: 0.3s !important; }
        .choices.is-open .choices__inner { border-radius: 16px 16px 0 0 !important; border-color: var(--primary) !important; }
        .choices.is-focused .choices__inner { border-color: var(--primary) !important; box-shadow: 0 0 0 4px rgba(115, 108, 237, 0.15) !important; background: #fff !important; }
        .choices__list--dropdown, .choices__list[aria-expanded] { border-radius: 0 0 16px 16px !important; border: 1px solid var(--border) !important; background-color: #FEF9FF !important; box-shadow: 0 20px 40px rgba(115, 108, 237, 0.1) !important; z-index: 2000 !important; }
        .choices__list--dropdown .choices__item--selectable { color: var(--text-dim) !important; padding: 12px 20px !important; font-size: 0.95rem !important;}
        .choices__list--dropdown .choices__item--selectable.is-highlighted { background-color: rgba(212, 193, 236, 0.3) !important; color: var(--primary) !important; }
        .choices__input { color: var(--text) !important; }
        .choices__input.choices__input--cloned { background-color: #fff !important; border: 1px solid var(--border) !important; border-radius: 8px !important; padding: 12px 16px !important; margin-bottom: 10px !important; color: var(--text) !important; }
        .choices__input.choices__input--cloned:focus { border-color: var(--primary) !important; box-shadow: none !important; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 16px; border-radius: 999px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 20px; box-shadow: 0 4px 15px rgba(115, 108, 237, 0.3); }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(115, 108, 237, 0.5); }
        .login-link { display: block; text-align: center; margin-top: 25px; font-size: 1rem; color: var(--text-dim); text-decoration: none; }
        .login-link span { color: var(--primary); font-weight: 700; transition: 0.2s;}
        .login-link:hover span { text-decoration: underline; }

        /* Phones: one field per row, no sideways scrolling */
        @media (max-width: 640px) {
            html, body { overflow-x: clip; }
            header { padding: 14px 16px; }
            nav { gap: 16px; }
            .form-row { flex-direction: column; gap: 20px; }
            input, select, textarea { font-size: 16px !important; }
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="shared.js"></script>
</head>
<body>
    <div class="ambient-bg"></div>

    <header>
        <a href="index.html" style="text-decoration: none;"><h2>Connect2Minds</h2></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Log In</a>
            <a href="join.html" class="active">Sign Up</a>
            <a class="h-full flex items-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="network" href="network.html">My Network</a><a href="saved.html">Saved Profiles</a>
        </nav>
    </header>

    <main>
        <div class="join-card">
            <div class="join-header">
                <h1>Join the Network</h1>
                <p>Create your secure developer profile.</p>
            </div>
            
            <form id="joinForm">
                <div class="form-group full"><label>Full Name</label><input type="text" id="regName" placeholder="e.g. John Doe" required></div>
                <div class="form-group full"><label>College Email (Optional — .edu.in/.ac.in emails get auto-verified!)</label><input type="email" id="regEmail" placeholder="e.g. yourname@college.edu.in"></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>College / University</label>
                        <select id="regCollege" class="searchable-select" required>
                            <option value="">Search your college...</option>
                            <option value="AISSMS College of Engineering, Pune">AISSMS College of Engineering, Pune</option>
                            <option value="Amrutvahini College of Engineering (AVCOE), Sangamner">Amrutvahini College of Engineering (AVCOE)</option>
                            <option value="Army Institute of Technology (AIT), Pune">Army Institute of Technology (AIT), Pune</option>
                            <option value="College of Engineering Pune (COEP)">College of Engineering Pune (COEP)</option>
                            <option value="Cummins College of Engineering for Women, Pune">Cummins College of Engineering for Women, Pune</option>
                            <option value="D. J. Sanghvi College of Engineering, Mumbai">D. J. Sanghvi College of Engineering, Mumbai</option>
                            <option value="D. Y. Patil College of Engineering, Akurdi">D. Y. Patil College of Engineering, Akurdi</option>
                            <option value="Pune Institute of Computer Technology (PICT)">Pune Institute of Computer Technology (PICT)</option>
                            <option value="Other / Not Listed">Other / Not Listed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select id="regDept" class="searchable-select" required>
                            <option value="">Search your branch...</option>
                            <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics & Telecommunication (E&TC)">Electronics & Telecommunication (E&TC)</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group"><label>Roll Number (Login ID)</label><input type="text" id="regRollNo" placeholder="e.g. 72" required></div>
                    <!-- SECURE FIX: Added Password Field -->
                    <div class="form-group"><label>Create Password</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6"></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>City</label><input type="text" id="regCity" placeholder="e.g. Pune" required></div>
                    <div class="form-group"><label>Division</label><input type="text" id="regDiv" placeholder="e.g. A" required></div>
                </div>
                
                <div class="form-group full"><label>Primary Skills (Comma separated)</label><input type="text" id="regSkills" placeholder="Python, React, Node.js..." required></div>
                <div class="form-group full"><label>Short Bio</label><textarea id="regBio" rows="3" placeholder="Tell the network a bit about yourself..." required></textarea></div>
                
                <p id="regStatus" style="color: var(--primary); font-weight: bold; display: none; text-align: center; margin-bottom: 15px;">Account created successfully! Redirecting...</p>
                <button type="submit" class="submit-btn" id="regBtn">Create Account</button>
            </form>
            
            <a href="login.html" class="login-link">Already have an account? <span>Log In here</span></a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.searchable-select').forEach(select => new Choices(select, { searchEnabled: true, itemSelectText: '', shouldSort: false }));
        });

        document.getElementById('joinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const statusText = document.getElementById('regStatus');
            btn.textContent = "Creating Account..."; btn.disabled = true;

            const profileData = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value || '',
                college_name: document.getElementById('regCollege').value,
                city: document.getElementById('regCity').value,
                department: document.getElementById('regDept').value,
                division: document.getElementById('regDiv').value,
                roll_no: document.getElementById('regRollNo').value,
                password: document.getElementById('regPassword').value,
                skills: document.getElementById('regSkills').value,
                bio: document.getElementById('regBio').value,
                profile_pic: "", banner_pic: ""
            };

            try {
                const res = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include',
                    body: JSON.stringify(profileData)
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('currentUserId', data.user_id);
                    statusText.style.display = 'block';
                    setTimeout(() => { window.location.href = "profile.html"; }, 1500);
                } else {
                    const errData = await res.json();
                    alert(errData.detail || "Failed to create profile. Ensure Roll Number is unique."); 
                    btn.textContent = "Create Account"; btn.disabled = false;
                }
            } catch (err) { alert("Network error. Backend server is unreachable."); btn.textContent = "Create Account"; btn.disabled = false; }
        });
    </script>
</body>
</html>
