<script>
// Ask for the hub right away, while styles and scripts are still downloading. college-hub.js picks up the result.
(function () {
  if (!localStorage.getItem('currentUserId')) return;
  var apiBase = window.C2M_API_BASE || ((/^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(location.hostname) || location.port === '5500') ? location.protocol + '//' + (location.hostname || '127.0.0.1') + ':8000' : location.origin);
  window.__pagePrefetch = fetch(apiBase + '/api/college-hub', { credentials: 'include' })
    .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
    .catch(function () { return null; });
})();
</script>
