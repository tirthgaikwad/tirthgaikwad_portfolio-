<!-- Workspace Application Engine -->
<script>
  let currentTeamId = null;
  let currentChannelId = null;
  let ws = null;
  let currentUser = null;

  async function init() {
    const currentUserId = localStorage.getItem('currentUserId');
    if (!currentUserId) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/profiles/${currentUserId}`, {
        credentials: 'include'
      });
      if (!res.ok) throw new Error("Not auth");
      currentUser = await res.json();
      
      await loadTeams();
      
      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 300);
      
    } catch (e) {
      console.error(e);
      window.location.href = 'login.html';
    }
  }

  async function loadTeams() {
    const res = await fetch(`${API_BASE}/api/teams`, {
      credentials: 'include'
    });
    const teams = await res.json();
    
    const list = document.getElementById('teams-list');
    list.innerHTML = '';
    
    teams.forEach(team => {
      const initial = team.name.charAt(0).toUpperCase();
      const isActive = team.id === currentTeamId;
      const html = `
        <div class="relative group flex items-center justify-center w-full mt-2" onclick="selectTeam(${team.id}, '${team.name}')">
          <div class="absolute left-0 w-1 ${isActive ? 'h-8 bg-brand-600' : 'h-0 group-hover:h-4 bg-slate-400'} rounded-r-md transition-all"></div>
          <button class="w-11 h-11 ${isActive ? 'rounded-2xl bg-brand-600 text-white' : 'rounded-3xl group-hover:rounded-2xl bg-white text-slate-700 hover:bg-brand-50 border border-slate-200'} font-bold text-sm flex items-center justify-center transition-all duration-200 shadow-sm" title="${team.name}">
            ${initial}
          </button>
        </div>
      `;
      list.insertAdjacentHTML('beforeend', html);
    });

    if (teams.length > 0 && !currentTeamId) {
      selectTeam(teams[0].id, teams[0].name);
    }
  }

  async function selectTeam(teamId, teamName) {
    currentTeamId = teamId;
    currentChannelId = null;
    if(ws) { ws.close(); ws = null; }
    
    // UI Update
    document.getElementById('channels-sidebar').classList.remove('hidden');
    document.getElementById('chat-area').classList.add('hidden');
    document.getElementById('active-team-name').textContent = teamName;
    
    await loadTeams(); // Re-render to update active styling
    await loadChannels(teamId);
    await loadMembers(teamId);
  }

  async function loadChannels(teamId) {
    const res = await fetch(`${API_BASE}/api/teams/${teamId}/channels`, {
      credentials: 'include'
    });
    const channels = await res.json();
    
    const list = document.getElementById('channels-list');
    list.innerHTML = '';
    
    channels.forEach(ch => {
      const isActive = ch.id === currentChannelId;
      const html = `
        <div onclick="selectChannel(${ch.id}, '${ch.name}')" class="flex items-center gap-1.5 px-2 py-1.5 rounded-md cursor-pointer mb-0.5 ${isActive ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-slate-600 hover:bg-slate-100'} transition-colors">
          <span class="material-symbols-outlined text-[18px] opacity-70">tag</span>
          <span class="text-sm truncate">${ch.name}</span>
        </div>
      `;
      list.insertAdjacentHTML('beforeend', html);
    });

    // Add Create Channel btn
    list.insertAdjacentHTML('beforeend', `
      <div onclick="openCreateChannelModal()" class="flex items-center gap-1.5 px-2 py-1.5 rounded-md cursor-pointer mt-2 text-slate-500 hover:text-brand-600 hover:bg-brand-50 transition-colors">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span class="text-sm font-medium">Add Channel</span>
      </div>
    `);

    // Auto select general channel if exists
    if (channels.length > 0 && !currentChannelId) {
      const general = channels.find(c => c.name === 'general') || channels[0];
      selectChannel(general.id, general.name);
    }
  }

  async function selectChannel(channelId, channelName) {
    currentChannelId = channelId;
    document.getElementById('chat-area').classList.remove('hidden');
    document.getElementById('active-channel-name').textContent = channelName;
    document.getElementById('message-input').placeholder = `Message #${channelName}`;
    
    await loadChannels(currentTeamId); // re-render for active styling
    await loadMessages(channelId);
    connectWebsocket(channelId);
  }

  async function loadMembers(teamId) {
    const res = await fetch(`${API_BASE}/api/teams/${teamId}/members`, {
      credentials: 'include'
    });
    const members = await res.json();
    
    const list = document.getElementById('members-list');
    list.innerHTML = '';
    
    members.forEach(m => {
      const pic = m.user_profile_pic || 'https://via.placeholder.com/40';
      const roleBadge = m.role === 'Admin' ? '<span class="material-symbols-outlined text-[12px] text-amber-500" title="Admin">stars</span>' : '';
      const html = `
        <div class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-slate-100 cursor-pointer transition-colors group">
          <img src="${pic}" class="w-8 h-8 rounded-full object-cover border border-slate-200">
          <div class="flex flex-col flex-1 min-w-0">
            <div class="flex items-center gap-1">
              <span class="text-sm font-semibold text-slate-700 truncate group-hover:text-slate-900">${m.user_name}</span>
              ${roleBadge}
            </div>
          </div>
        </div>
      `;
      list.insertAdjacentHTML('beforeend', html);
    });
  }

  async function loadMessages(channelId) {
    const res = await fetch(`${API_BASE}/api/channels/${channelId}/messages`, {
      credentials: 'include'
    });
    const messages = await res.json();
    
    const feed = document.getElementById('messages-feed');
    feed.innerHTML = '';
    
    messages.forEach(msg => {
      appendMessage(msg, false);
    });
    scrollToBottom();
  }

  function appendMessage(msg, scroll = true) {
    const feed = document.getElementById('messages-feed');
    const pic = msg.sender_pic || 'https://via.placeholder.com/40';
    const isMe = msg.sender_id === currentUser.id;
    
    const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    const html = `
      <div class="flex gap-3 hover:bg-slate-50 py-1.5 px-2 rounded-md transition-colors group ${isMe ? 'bg-brand-50/30' : ''}">
        <img src="${pic}" class="w-10 h-10 rounded-full object-cover shrink-0 border border-slate-200 mt-0.5">
        <div class="flex flex-col min-w-0 flex-1">
          <div class="flex items-baseline gap-2">
            <span class="font-semibold text-[15px] text-slate-900">${msg.sender_name}</span>
            <span class="text-[11px] font-medium text-slate-400 group-hover:text-slate-500">${time}</span>
          </div>
          <p class="text-[15px] text-slate-700 leading-relaxed break-words whitespace-pre-wrap">${msg.content}</p>
        </div>
      </div>
    `;
    feed.insertAdjacentHTML('beforeend', html);
    if(scroll) scrollToBottom();
  }

  function scrollToBottom() {
    const feed = document.getElementById('messages-feed');
    feed.scrollTop = feed.scrollHeight;
  }

  function connectWebsocket(channelId) {
    if(ws) ws.close();
    const wsUrl = API_BASE.replace(/^http/, 'ws') + `/api/ws/channels/${channelId}/${currentUser.id}`;
    ws = new WebSocket(wsUrl);
    
    ws.onmessage = function(event) {
      const msg = JSON.parse(event.data);
      // Ensure we don't duplicate our own message if rest API returned first, but for now just append
      // In a real app we'd check msg.id against rendered ones
      appendMessage(msg);
    };
    ws.onclose = () => console.log("WS closed");
  }

  function submitMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if(!content || !currentChannelId) return;
    
    input.value = '';
    // reset height if it was auto-expanding
    
    fetch(`${API_BASE}/api/channels/${currentChannelId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ content: content })
    }).catch(e => console.error("Message send failed", e));
  }

  document.getElementById('message-form').addEventListener('submit', (e) => {
    e.preventDefault();
    submitMessage();
  });

  // Modals & UI
  function toggleMembers() {
    const sidebar = document.getElementById('members-sidebar');
    if (sidebar.classList.contains('hidden')) {
      sidebar.classList.remove('hidden');
      sidebar.classList.add('flex');
    } else {
      sidebar.classList.add('hidden');
      sidebar.classList.remove('flex');
    }
  }

  function openCreateTeamModal() { document.getElementById('create-team-modal').classList.add('active'); }
  function openCreateChannelModal() { document.getElementById('create-channel-modal').classList.add('active'); }
  function openAddMemberModal() { 
    if (!currentTeamId) return;
    document.getElementById('add-member-modal').classList.add('active'); 
  }
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

  document.getElementById('create-team-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('new-team-name').value;
    const desc = document.getElementById('new-team-desc').value;
    try {
      const res = await fetch(`${API_BASE}/api/teams`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name, description: desc })
      });
      if(res.ok) {
        const team = await res.json();
        // Immediately create a general channel for the new team via backend trigger, but our backend doesn't automatically create one in /api/teams yet!
        // We will create one manually here:
        await fetch(`${API_BASE}/api/teams/${team.id}/channels`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name: 'general', channel_type: 'text' })
        });

        closeModals();
        document.getElementById('create-team-form').reset();
        await loadTeams();
        selectTeam(team.id, team.name);
      }
    } catch(err) { console.error(err); }
  });

  document.getElementById('create-channel-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('new-channel-name').value;
    try {
      const res = await fetch(`${API_BASE}/api/teams/${currentTeamId}/channels`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name: name, channel_type: 'text' })
      });
      if(res.ok) {
        closeModals();
        document.getElementById('create-channel-form').reset();
        await loadChannels(currentTeamId);
      }
    } catch(err) { console.error(err); }
  });

  document.getElementById('add-member-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const userId = parseInt(document.getElementById('new-member-id').value);
    const role = document.getElementById('new-member-role').value;
    try {
      const res = await fetch(`${API_BASE}/api/teams/${currentTeamId}/members`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ user_id: userId, role: role })
      });
      if(res.ok) {
        closeModals();
        document.getElementById('add-member-form').reset();
        await loadMembers(currentTeamId);
      } else {
        const err = await res.json();
        window.showSystemModal('Error', err.detail || 'Could not add member.');
      }
    } catch(err) { console.error(err); }
  });

  // Stubs for system modals
  window.showSystemModal = function(title, text) {
    alert(`${title}\n\n${text}\n\n(This feature is a UI simulation for demonstration purposes.)`);
  }

  // Textarea auto-resize
  const tx = document.getElementById("message-input");
  tx.setAttribute("style", "height:" + (tx.scrollHeight) + "px;overflow-y:hidden;");
  tx.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
  });

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
