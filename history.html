<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPartner | Activity History</title>
    
    <!-- Professional Font Stack -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        /* Light Theme - Sleek Professional Colors */
        :root { 
            --bg: #FFFFFF; 
            --surface: rgba(255, 255, 255, 0.9); 
            --card-bg: #FFFFFF;
            --border: #E5E5E5; 
            --primary: #4F46E5; 
            --secondary: #818CF8; 
            --accent: #E5E5E5; 
            --text: #000000; 
            --text-dim: #666666; 
            --header-bg: rgba(255, 255, 255, 0.85);
            --input-bg: #F5F5F5;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.04);
        }

        /* Dark Theme - Totally Dark OLED Mode */
        [data-theme="dark"] {
            --bg: #000000; 
            --surface: rgba(0, 0, 0, 0.85); 
            --card-bg: #000000;
            --border: #333333; 
            --primary: #4F46E5; 
            --secondary: #818CF8; 
            --text: #F8FAFC; 
            --text-dim: #999999;
            --header-bg: rgba(0, 0, 0, 0.85);
            --input-bg: #111111;
            --shadow-sm: 0 1px 3px rgba(255, 255, 255, 0.05);
            --shadow-md: 0 4px 12px rgba(255, 255, 255, 0.05);
            --shadow-lg: 0 12px 32px rgba(255, 255, 255, 0.05);
        }

        /* Premium Custom Scrollbar */
        ::-webkit-scrollbar { 
            width: 6px; 
            height: 6px; 
        }

        ::-webkit-scrollbar-track { 
            background: transparent; 
        }

        ::-webkit-scrollbar-thumb { 
            background: var(--border); 
            border-radius: 10px; 
        }

        ::-webkit-scrollbar-thumb:hover { 
            background: var(--text-dim); 
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            overflow-x: hidden; 
            transition: background-color 0.2s ease, color 0.2s ease; 
        }

        /* HEADER STYLES */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 5%; 
            background: var(--header-bg); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); 
            z-index: 100; 
            position: relative; 
            transition: background-color 0.2s, margin-top 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        header h2 { 
            font-weight: 800; 
            color: var(--primary);
            font-size: 1.5rem; 
            letter-spacing: -0.5px;
        }

        nav { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            flex-wrap: wrap; 
            justify-content: flex-end;
        }

        nav a:not(.btn-logout) { 
            color: var(--text-dim); 
            text-decoration: none; 
            font-weight: 600; 
            transition: all 0.2s ease; 
            font-size: 0.85rem; 
            cursor: pointer; 
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
        }

        nav a:not(.btn-logout):hover {
            color: var(--text);
            background: var(--input-bg);
        }

        nav a:not(.btn-logout).active { 
            background: var(--text); 
            color: var(--card-bg); 
        }

        .btn-logout { 
            background: transparent; 
            color: #ef4444; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: 600; 
            border: 1px solid transparent; 
            transition: all 0.2s ease;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .btn-logout:hover { 
            background: rgba(239, 68, 68, 0.08); 
        }

        .theme-toggle { 
            cursor: pointer; 
            color: var(--text-dim); 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-right: 8px;
            padding: 8px;
            border-radius: 8px;
            background: transparent;
        }

        .theme-toggle:hover { 
            color: var(--text); 
            background: var(--input-bg);
        }

        .theme-toggle svg { width: 18px; height: 18px; }

        .nav-bell-container { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            margin-right: 12px;
            padding: 8px;
            border-radius: 8px;
            background: transparent;
            transition: 0.2s;
        }

        .nav-bell-container:hover {
            background: var(--input-bg);
        }

        .nav-bell-icon { width: 18px; height: 18px; color: var(--text-dim); transition: 0.2s; }
        .nav-bell-container:hover .nav-bell-icon { color: var(--text); }

        .notification-badge { 
            position: absolute; 
            top: 2px; 
            right: 2px; 
            background: #ef4444; 
            color: white; 
            font-size: 0.65rem; 
            font-weight: bold; 
            width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            transition: 0.2s; 
        }

        .notification-badge.active { opacity: 1; }

        .notification-dropdown { 
            position: absolute; 
            top: 45px; 
            right: 0; 
            width: 340px; 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            box-shadow: var(--shadow-lg); 
            display: none; 
            flex-direction: column; 
            z-index: 1000; 
            overflow: hidden; 
            transition: 0.3s; 
        }

        .notification-dropdown.active { display: flex; animation: slideDown 0.2s ease forwards; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notif-header { 
            padding: 16px 20px; 
            border-bottom: 1px solid var(--border); 
            font-weight: 700; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: var(--input-bg);
            font-size: 0.9rem;
        }

        .notif-header span { 
            font-size: 0.75rem; 
            color: var(--primary); 
            cursor: pointer; 
            font-weight: 600;
        }

        .notif-list { max-height: 350px; overflow-y: auto; }

        .notif-item { 
            padding: 16px 20px; 
            border-bottom: 1px solid var(--border); 
            transition: background 0.2s ease; 
            font-size: 0.85rem; 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            cursor: pointer;
        }

        .notif-item:hover { background: var(--input-bg); }
        .notif-item.unread { background: rgba(79, 70, 229, 0.04); font-weight: 600; border-left: 3px solid var(--primary); }
        .notif-time { font-size: 0.75rem; color: var(--text-dim); font-weight: 500; }
        .notif-empty { padding: 40px; text-align: center; color: var(--text-dim); font-size: 0.9rem; font-weight: 500; }

        /* Pull Tab Header */
        .header-toggle-tab {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: var(--header-bg);
            border: 1px solid var(--border);
            border-top: none;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-dim);
            z-index: 1000;
            transition: 0.2s;
        }
        
        .header-toggle-tab:hover { color: var(--text); }
        .header-toggle-tab svg { width: 14px; height: 14px; transition: transform 0.4s; }
        header.collapsed .header-toggle-tab svg { transform: rotate(180deg); }

        /* PAGE SPECIFIC: HISTORY STYLES */
        .history-hero { 
            text-align: center; 
            padding: 60px 5% 40px 5%; 
        }

        .history-hero h1 { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: var(--text); 
            margin-bottom: 12px; 
            letter-spacing: -1px; 
        }

        .history-hero p { 
            color: var(--text-dim); 
            max-width: 800px; 
            margin: 0 auto; 
            font-size: 1.05rem; 
            line-height: 1.6; 
            font-weight: 500;
        }

        .main-container { 
            padding: 0 5% 60px 5%; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%;
        }

        .history-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 32px; 
            box-shadow: var(--shadow-sm); 
            transition: background-color 0.3s;
        }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            padding: 20px 24px;
            background: transparent;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--input-bg);
            border-radius: 12px;
            border-bottom-color: transparent;
            transform: translateX(4px);
        }

        .history-time {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .history-time::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px rgba(79, 70, 229, 0.4);
        }

        .history-action {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .history-detail {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .empty-state { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center; 
            color: var(--text-dim); 
            padding: 60px 20px; 
            font-size: 1.05rem; 
            font-weight: 500; 
        }

        .loader-text {
            text-align: center;
            color: var(--text-dim);
            padding: 60px;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <a href="index.html" style="text-decoration: none;">
            <h2 class="logo">ProPartner</h2>
        </a>
        
        <nav>
            <div class="theme-toggle" id="themeToggleBtn" title="Toggle Dark Mode">
                <svg id="moonIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg id="sunIcon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </div>

            <div class="nav-bell-container" id="notifBellBtn">
                <svg class="nav-bell-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                <div class="notification-badge" id="notifBadge">0</div>
                <div class="notification-dropdown" id="notifDropdown">
                    <div class="notif-header">Notifications</div>
                    <div class="notif-list" id="notifList">
                        <div class="notif-empty">No notifications yet.</div>
                    </div>
                </div>
            </div>

            <a href="search.html">Search</a>
            <a href="register.html">Sign Up</a>
            <a href="board.html">Opportunities Board</a>
            <a href="team.html">My Teams</a>
            <a href="college.html">My College</a>
            <a href="department.html">My Department</a>
            <a href="global.html">Global Network</a>
            <a href="network.html">My Network</a>
            <a href="saved.html">Saved Profiles</a>
            <a href="inbox.html">Inbox</a>
            <a href="history.html" class="active">History</a>
            <a href="profile.html">My Profile</a>
            <a onclick="logout()" class="btn-logout" style="cursor: pointer;">Log Out</a>
        </nav>

        <div class="header-toggle-tab" id="headerToggleTab" title="Toggle Navigation Bar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
            </svg>
        </div>
    </header>

    <div class="history-hero">
        <h1>Activity Log</h1>
        <p>A secure timeline of your recent activity and connections.</p>
    </div>

    <main class="main-container">
        <div class="history-card">
            <div class="history-list" id="historyList">
                <div class="loader-text">Loading your timeline...</div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // HEADER TOGGLE LOGIC
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.getElementById('mainHeader');
            const toggleTab = document.getElementById('headerToggleTab');
            let isHeaderCollapsed = false;

            if (toggleTab) {
                toggleTab.addEventListener('click', () => {
                    if (!isHeaderCollapsed) {
                        const headerHeight = header.offsetHeight;
                        header.style.marginTop = `-${headerHeight}px`;
                        header.classList.add('collapsed');
                        isHeaderCollapsed = true;
                    } else {
                        header.style.marginTop = '0px';
                        header.classList.remove('collapsed');
                        isHeaderCollapsed = false;
                    }
                });

                window.addEventListener('resize', () => {
                    if (isHeaderCollapsed) {
                        header.style.transition = 'none';
                        header.style.marginTop = '0px';
                        
                        setTimeout(() => {
                            const newHeight = header.offsetHeight;
                            header.style.marginTop = `-${newHeight}px`;
                            
                            setTimeout(() => {
                                header.style.transition = 'background-color 0.2s, margin-top 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                            }, 50);
                        }, 10);
                    }
                });
            }
        });

        // ==========================================
        // UI & THEME LOGIC
        // ==========================================
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');

        if (localStorage.getItem('theme') === 'dark') {
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        }

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            }
        });

        // ==========================================
        // LOAD ACTIVITY HISTORY
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const currentUserId = localStorage.getItem('currentUserId');
            
            if (!currentUserId) {
                window.location.href = 'login.html';
                return;
            }

            initNotifications(currentUserId);
            fetchHistory();
        });

        async function fetchHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div class="loader-text">Loading your timeline...</div>';
            
            try {
                const res = await fetch('http://127.0.0.1:8000/api/history', { 
                    credentials: 'include' 
                });
                
                if (res.ok) {
                    const logs = await res.json();
                    renderHistory(logs);
                } else {
                    list.innerHTML = '<div class="empty-state">Failed to load history.</div>';
                }
            } catch (err) {
                list.innerHTML = '<div class="empty-state" style="color: #ef4444;">Server error. Cannot connect to database.</div>';
            }
        }

        function renderHistory(logs) {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            if (logs.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="48" height="48" style="opacity: 0.5;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        No activity logged yet. Explore the network!
                    </div>
                `;
                return;
            }

            logs.forEach(log => {
                const dateObj = new Date(log.time);
                const timeStr = dateObj.toLocaleDateString() + ' at ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                const div = document.createElement('div');
                div.className = 'history-item';
                
                div.innerHTML = `
                    <div class="history-time">${timeStr}</div>
                    <div class="history-action">${log.action}</div>
                    <div class="history-detail">${log.detail}</div>
                `;
                
                list.appendChild(div);
            });
        }

        // ==========================================
        // NOTIFICATIONS SYSTEM
        // ==========================================
        let unreadCount = 0;
        let notifSocket = null;

        async function initNotifications(userId) {
            const bellBtn = document.getElementById('notifBellBtn');
            const dropdown = document.getElementById('notifDropdown');
            
            bellBtn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                dropdown.classList.toggle('active'); 
            });
            
            document.addEventListener('click', (e) => { 
                if (!bellBtn.contains(e.target)) {
                    dropdown.classList.remove('active'); 
                }
            });
            
            dropdown.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            await fetchAndRenderNotifications(userId);

            notifSocket = new WebSocket(`ws://127.0.0.1:8000/api/ws/notifications/${userId}`);
            
            notifSocket.onmessage = function(event) {
                const incomingNotif = JSON.parse(event.data);
                insertNotificationUI(incomingNotif, true);
                unreadCount++; 
                updateBadge();
            };
        }

        async function fetchAndRenderNotifications(userId) {
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/notifications/${userId}`, { 
                    credentials: 'include' 
                });
                
                if (res.ok) {
                    const notifs = await res.json();
                    const notifList = document.getElementById('notifList');
                    notifList.innerHTML = ''; 
                    unreadCount = 0;
                    
                    if(notifs.length === 0) { 
                        notifList.innerHTML = `<div class="notif-empty">No notifications yet.</div>`; 
                        return; 
                    }
                    
                    notifs.forEach(n => { 
                        if (n.is_read === 0) {
                            unreadCount++; 
                        }
                        insertNotificationUI(n, false); 
                    });
                    
                    updateBadge();
                }
            } catch (err) {
                console.error("Notification fetch failed");
            }
        }

        function insertNotificationUI(notif, prepend = false) {
            const notifList = document.getElementById('notifList');
            const emptyState = notifList.querySelector('.notif-empty');
            
            if (emptyState) {
                emptyState.remove();
            }

            const dateObj = new Date(notif.timestamp);
            const timeStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const div = document.createElement('div');
            div.className = `notif-item ${notif.is_read === 0 ? 'unread' : ''}`;
            
            div.innerHTML = `
                <div>${notif.content}</div>
                <div class="notif-time">${timeStr}</div>
            `;
            
            div.addEventListener('click', async () => {
                if (div.classList.contains('unread')) {
                    try {
                        await fetch(`http://127.0.0.1:8000/api/notifications/${notif.id}/read`, { 
                            method: 'PUT', 
                            credentials: 'include' 
                        });
                        
                        div.classList.remove('unread'); 
                        unreadCount = Math.max(0, unreadCount - 1); 
                        updateBadge();
                        
                        if(notif.type === 'message') {
                            window.location.href = 'inbox.html';
                        }
                        if(notif.type === 'follow') {
                            window.location.href = 'network.html';
                        }
                    } catch(e) {
                        console.error(e);
                    }
                }
            });
            
            if (prepend) {
                notifList.prepend(div); 
            } else {
                notifList.appendChild(div);
            }
        }

        function updateBadge() {
            const badge = document.getElementById('notifBadge');
            
            if (unreadCount > 0) { 
                badge.textContent = unreadCount; 
                badge.classList.add('active'); 
            } else {
                badge.classList.remove('active');
            }
        }

        async function logout() {
            try { 
                await fetch('http://127.0.0.1:8000/api/logout', { 
                    method: 'POST', 
                    credentials: 'include' 
                }); 
            } catch (err) {}
            
            localStorage.removeItem('currentUserId');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
